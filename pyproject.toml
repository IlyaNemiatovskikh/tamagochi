[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "E501"]

[tool.ruff.format]
quote-style = "single"

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true

[tool.ruff.lint.pep8-naming]
ignore-names = ["TamagochiIsGone", "NotEnoughMoney"]

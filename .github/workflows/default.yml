name: Project checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install development tools
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest ./tests
      - name: Run Ruff
        run: ruff check ./game main.py tests
      - name: Run Flake8
        run: flake8 ./game main.py tests
